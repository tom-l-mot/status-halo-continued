name: Check module

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check main.js
      - run: node --test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python create_release.py module
      - uses: actions/upload-artifact@v4
        with:
          name: status-halo-continued-development
          path: dist/*
